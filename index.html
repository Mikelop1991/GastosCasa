<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastos Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#123a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos Casa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Identidad: la libreta de ahorro y el papel de seguridad de los billetes.
   Fondo verde celadón muy pálido, tinta verde botella, guilloché en la cabecera,
   y los movimientos del mes "impresos" como en una libreta del banco. */
:root {
  --paper: #e8f0eb;       /* papel de seguridad */
  --sheet: #f9fcfa;       /* hoja de libreta */
  --ink: #123a33;         /* tinta verde botella */
  --ink-2: #3f5e57;       /* tinta suave */
  --rule: #c5d8ce;        /* rayado */
  --note: #2b7a64;        /* verde billete: acciones */
  --note-ink: #ffffff;
  --note-soft: #d5e9e0;
  --stamp: #b3262f;       /* tinta de sello: avisos y subidas */
  --stamp-soft: #f6dfe0;
  --gold: #a7802c;        /* hilo de seguridad */
  --band: #123a33;
  --band-ink: #eaf4ef;
  --guil: rgba(214, 238, 226, .22);
  --serie-a: #13866a;     /* año que miras */
  --serie-b: #a7802c;     /* año con el que comparas */
  --serie-otros: #b9cbc3;
  --shadow: 0 1px 0 rgba(18,58,51,.08), 0 6px 18px -8px rgba(18,58,51,.25);
  --f-ui: "Libre Franklin", "Franklin Gothic Medium", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-print: "Courier Prime", "Courier New", ui-monospace, monospace;
  --tab-h: 76px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1f1b; --sheet: #142a25; --ink: #e3f1ea; --ink-2: #a4c1b7; --rule: #2a4740;
    --note: #4fb595; --note-ink: #08201a; --note-soft: #1d3d35; --stamp: #f07f86; --stamp-soft: #3d2023;
    --gold: #d9b45e; --band: #0a1916; --band-ink: #e3f1ea; --guil: rgba(120, 200, 170, .16); --serie-a: #2a9876; --serie-b: #b5893a; --serie-otros: #34524a;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px -8px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1f1b; --sheet: #142a25; --ink: #e3f1ea; --ink-2: #a4c1b7; --rule: #2a4740;
  --note: #4fb595; --note-ink: #08201a; --note-soft: #1d3d35; --stamp: #f07f86; --stamp-soft: #3d2023;
  --gold: #d9b45e; --band: #0a1916; --band-ink: #e3f1ea; --guil: rgba(120, 200, 170, .16); --serie-a: #2a9876; --serie-b: #b5893a; --serie-otros: #34524a;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px -8px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
html.grande { font-size: 19px; }
html.xgrande { font-size: 21.5px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); line-height: 1.45;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
h2 { font-size: 1.35rem; margin: 0 0 .6rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.05rem; margin: 0; font-weight: 700; }

/* ---------- cabecera: el billete ---------- */
.band { position: relative; overflow: hidden; background: var(--band); color: var(--band-ink);
  padding: calc(14px + env(safe-area-inset-top)) 16px 20px; }
.band svg.guil { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
  background: repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 20px); opacity: .75; }
.band-in { position: relative; max-width: 1040px; margin: 0 auto; display: grid; gap: 4px; }
.band-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; letter-spacing: .01em; }
.marca svg { width: 26px; height: 26px; }
.sync { border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06); color: inherit; border-radius: 999px;
  padding: 5px 12px; font-size: .8rem; display: inline-flex; gap: 6px; align-items: center; min-height: 34px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: #7fd8b4; display: inline-block; }
.sync.off i { background: #f2b35a; } .sync.busy i { animation: lat 1s infinite; }
@keyframes lat { 50% { opacity: .2; } }
.mesnav { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.mesnav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: transparent; color: inherit; font-size: 1.3rem; line-height: 1; }
.mesnav button:disabled { opacity: .3; }
.mesnav .mes { font-size: 1.15rem; font-weight: 700; min-width: 9.5em; text-align: center; }
.total { font-size: clamp(2.6rem, 11vw, 4rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.02; margin-top: 6px; }
.total small { font-size: .45em; font-weight: 500; margin-left: .15em; opacity: .8; }
.vs { font-size: .9rem; opacity: .9; }
.vs b { font-weight: 700; }
.vs .up { color: #ffb4b8; } .vs .down { color: #9fe3c6; }

/* ---------- vistas ---------- */
main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 30px; }
.view { display: grid; gap: 22px; }
@media (min-width: 900px) { .two { grid-template-columns: 1.1fr .9fr; align-items: start; } }
.ask { font-size: 1.25rem; font-weight: 800; margin: 0 0 10px; }

/* rejilla de conceptos */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 560px) { .cats { grid-template-columns: repeat(4, 1fr); } }
.cat { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 6px 10px; min-height: 96px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
  box-shadow: var(--shadow); transition: transform .08s; }
.cat:active { transform: scale(.97); }
.cat svg { width: 34px; height: 34px; color: var(--note); }
.cat span { font-size: .84rem; font-weight: 700; line-height: 1.15; }
.cat em { font-style: normal; font-size: .86rem; color: var(--ink-2); }
.cat.has em { color: var(--note); font-weight: 700; }

/* habituales que faltan */
.falta { background: var(--sheet); border: 1px dashed var(--gold); border-radius: 12px; padding: 12px 14px; }
.falta h3 { margin-bottom: 6px; }
.falta ul { list-style: none; margin: 0; padding: 0; }
.falta li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); }
.falta li:first-child { border-top: 0; }
.falta .q { flex: 1; min-width: 0; }
.falta .q b { display: block; font-size: .95rem; }
.falta .q span { font-size: .9rem; color: var(--ink-2); }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 10px 16px; min-height: 48px; font-weight: 700; }
.btn.go { background: var(--note); color: var(--note-ink); border-color: var(--note); }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: .9rem; }
.btn.wide { width: 100%; }
.btn.danger { color: var(--stamp); border-color: var(--stamp); background: transparent; }
.btn:disabled { opacity: .5; }

/* ---------- la libreta ---------- */
.libreta { background: var(--sheet); border-radius: 4px 12px 12px 4px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  border: 1px solid var(--rule); }
.libreta::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  background: repeating-linear-gradient(180deg, var(--rule) 0 3px, transparent 3px 9px); }
.lib-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px 8px 20px; border-bottom: 2px solid var(--ink); gap: 8px; }
.lib-cols { display: grid; grid-template-columns: 4.2em 1fr auto 1.6em; gap: 8px; padding: 4px 14px 4px 20px; font-size: .8rem; color: var(--ink-2); border-bottom: 1px solid var(--rule); }
.mov { display: grid; grid-template-columns: 4.2em 1fr auto 1.6em; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 9px 14px 9px 20px; border-bottom: 1px solid var(--rule); font-family: var(--f-print); font-size: .98rem; min-height: 48px; }
.mov:hover { background: var(--note-soft); }
.mov .d { color: var(--ink-2); }
.mov .c { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mov .c small { display: block; font-size: .9rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mov .i { font-weight: 700; text-align: right; white-space: nowrap; }
.mov .lapiz { color: var(--note); justify-self: end; align-self: center; width: 20px; height: 20px; }
.lib-hint { padding: 8px 14px 8px 20px; font-size: .84rem; color: var(--ink-2); border-bottom: 1px solid var(--rule); background: var(--paper); }
.mov.pend .i::after { content: " ·"; color: var(--gold); }
.lib-foot { display: grid; grid-template-columns: 1fr auto; padding: 12px 14px 14px 20px; font-family: var(--f-print); font-weight: 700; font-size: 1.05rem; border-top: 2px solid var(--ink); }
.vacio { padding: 26px 20px; text-align: center; color: var(--ink-2); }

/* totales por concepto */
.barras { display: grid; gap: 8px; }
.barra { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .92rem; }
.barra .t { height: 8px; grid-column: 1 / -1; background: var(--note-soft); border-radius: 4px; overflow: hidden; }
.barra .t i { display: block; height: 100%; background: var(--note); border-radius: 4px; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-weight: 600; }
.seg button.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

/* año: columnas por mes */
.meses { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 160px; padding-top: 18px; }
.mcol { display: flex; flex-direction: column; align-items: center; justify-content: end; height: 100%; gap: 4px; border: 0; background: none; padding: 0; position: relative; }
.mcol i { width: 100%; max-width: 34px; background: var(--note); border-radius: 4px 4px 0 0; min-height: 2px; }
.mcol.sel i { background: var(--ink); }
.mcol span { font-size: .76rem; color: var(--ink-2); }
.mcol b { position: absolute; top: -18px; font-size: .66rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; display: none; }
.mcol.sel b { display: block; color: var(--ink); }
.buscar { display: grid; gap: 6px; }
.bq { display: flex; align-items: center; gap: 8px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 12px; padding: 0 6px 0 12px; }
.bq:focus-within { border-color: var(--note); }
.bq svg { width: 22px; height: 22px; color: var(--ink-2); flex: none; }
.bq input { border: 0; background: transparent; min-height: 54px; padding: 0; font-size: 1.05rem; outline: none; }
.bq input::-webkit-search-cancel-button { display: none; }
.bq .x { flex: none; width: 40px; height: 40px; }
.barra[role=button] { cursor: pointer; border-radius: 6px; }
.barra[role=button]:hover span:first-child { color: var(--note); text-decoration: underline; }
.cab-anio { flex-wrap: wrap; } .cab-anio h2 { white-space: nowrap; }
.aviso-anios { margin: 0; padding: 12px 14px; border: 1px dashed var(--gold); border-radius: 12px; background: var(--sheet); }
.filtro-cat { display: grid; gap: 6px; }
.filtro-cat .seg { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.filtro-cat .seg button { white-space: nowrap; flex: none; }
.dif { font-weight: 700; white-space: nowrap; }
.dif.up { color: var(--stamp); } .dif.down { color: var(--note); }
.anios { display: grid; gap: 2px; }
.arow { display: grid; grid-template-columns: 3.2em 1fr auto; gap: 10px; align-items: center; border: 0; background: none; padding: 6px 4px; border-radius: 8px; text-align: left; min-height: 48px; }
.arow:hover { background: var(--note-soft); }
.ay { font-weight: 800; }
.abar { height: 14px; background: var(--note-soft); border-radius: 4px; overflow: hidden; }
.abar i { display: block; height: 100%; background: var(--serie-a); border-radius: 0 4px 4px 0; }
.abar i.parcial { background: repeating-linear-gradient(135deg, var(--serie-a) 0 6px, color-mix(in srgb, var(--serie-a) 55%, transparent) 6px 10px); }
.av { text-align: right; font-weight: 700; display: grid; line-height: 1.15; min-width: 6.5em; }
.av small { font-weight: 600; font-size: .76rem; color: var(--ink-2); }
.cmp-sel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp-sel label { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
.cmp-sel label span { display: flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.sw.a { background: var(--serie-a); height: 5px; } .sw.b { background: var(--serie-b); }
.graf svg { width: 100%; height: auto; display: block; overflow: visible; }
.graf .gl { stroke: var(--rule); stroke-width: 1; }
.graf .ax { fill: var(--ink-2); font-size: 12px; font-family: var(--f-ui); }
.graf .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.graf .ln.a { stroke: var(--serie-a); stroke-width: 3; } .graf .ln.b { stroke: var(--serie-b); stroke-dasharray: 7 5; }
.graf .ln.otros { stroke: var(--serie-otros); stroke-width: 1.5; }
.graf .pt { stroke: var(--sheet); stroke-width: 2; } .graf .pt.a { fill: var(--serie-a); } .graf .pt.b { fill: var(--serie-b); }
.graf .lbl.bajo { transform: translateY(9px); } .graf .lbl.alto { transform: translateY(-9px); }
.graf .lbl { font-size: 13px; font-weight: 800; font-family: var(--f-ui); fill: var(--ink); }
.graf .cruz { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0; }
.graf .hit { fill: transparent; cursor: pointer; }
.lectura { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; min-height: 2.4em; padding: 8px 10px; background: var(--paper); border-radius: 10px; font-size: .95rem; }
.tabla-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
.tabla { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tabla th, .tabla td { padding: 9px 8px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
.tabla thead th { font-size: .8rem; color: var(--ink-2); font-weight: 700; border-bottom: 2px solid var(--ink); }
.tabla td.num, .tabla th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabla tbody tr[data-cc2] { cursor: pointer; } .tabla tbody tr[data-cc2]:hover, .tabla tr.sel { background: var(--note-soft); }
.tabla tbody th { font-weight: 600; position: sticky; left: 0; background: var(--sheet); }
.tabla tr.sel th { background: var(--note-soft); }
.tabla tr.tot th, .tabla tr.tot td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 0; }
.periodo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.periodo label { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
.cifras { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 640px) { .cifras { grid-template-columns: repeat(4, 1fr); } }
.cifra { border-left: 3px solid var(--gold); padding: 2px 0 2px 10px; }
.cifra b { display: block; font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; }
.cifra span { font-size: .9rem; color: var(--ink-2); }

/* ---------- hoja para apuntar ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(6, 22, 18, .5); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--paper); border-radius: 18px 18px 0 0; max-height: 94vh; overflow: auto;
  padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,.25); }
@media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 560px; translate: -50% 0; bottom: auto; top: 6vh; border-radius: 16px; max-height: 88vh; } }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--rule); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sheet-head svg { width: 36px; height: 36px; color: var(--note); flex: none; }
.sheet-head h2 { margin: 0; flex: 1; font-size: 1.2rem; }
.x { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet); font-size: 1.3rem; }
.cheque { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.field { display: grid; gap: 6px; }
.field > label, .lab { font-weight: 700; font-size: .92rem; }
.importe { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 2px; }
.importe input { border: 0; background: transparent; font-size: 2.6rem; font-weight: 800; letter-spacing: -.02em; width: 100%; padding: 2px 0; outline: none; font-variant-numeric: tabular-nums; }
.importe span { font-size: 1.8rem; font-weight: 700; color: var(--ink-2); }
.importe:focus-within { border-color: var(--note); }
.leido { font-size: .85rem; color: var(--note); min-height: 1.2em; }
.leido.mal { color: var(--stamp); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 6px 14px; min-height: 42px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
input[type=text], input[type=date], input[type=url], select { border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 10px 12px; min-height: 48px; width: 100%; }
.otroscat { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.otroscat button { text-align: left; }
details summary { cursor: pointer; font-weight: 600; color: var(--ink-2); min-height: 40px; display: flex; align-items: center; }
.acciones { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; }
.acciones .go { min-height: 56px; font-size: 1.1rem; }
.repe { background: var(--stamp-soft); border: 2px solid var(--stamp); border-radius: 12px; padding: 12px 12px 6px; display: grid; gap: 4px; }
.repe b { color: var(--stamp); font-size: 1.1rem; }
.repe-l { margin: 4px -12px 0; }
.repe-l .mov { background: transparent; cursor: default; border-bottom: 0; border-top: 1px solid var(--rule); }
.repe-l .mov .lapiz { display: none; }

/* ---------- pestañas ---------- */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--sheet); border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { border: 0; background: none; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--ink-2); }
nav.tabs svg { width: 26px; height: 26px; }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on svg { color: var(--note); }
nav.tabs .plus { color: var(--note-ink); }
nav.tabs .plus span.ico { width: 52px; height: 36px; border-radius: 18px; background: var(--note); display: grid; place-items: center; }
nav.tabs .plus svg { width: 24px; height: 24px; color: var(--note-ink) !important; }
nav.tabs .plus { color: var(--ink); }
@media (min-width: 900px) { body { padding-bottom: calc(var(--tab-h) + 40px); } nav.tabs { max-width: 560px; margin: 0 auto 14px; border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); } }

.toast { position: fixed; left: 50%; translate: -50% 0; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom)); z-index: 60;
  background: var(--ink); color: var(--sheet); padding: 12px 18px; border-radius: 10px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.demo { background: var(--gold); color: #1d1606; text-align: center; font-size: .82rem; padding: 6px 12px; font-weight: 600; }
.sello { display: inline-block; border: 2px solid var(--note); color: var(--note); border-radius: 6px; padding: 1px 8px; font-weight: 800; font-size: .8rem; transform: rotate(-4deg); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s cubic-bezier(.2,.8,.2,1); } @keyframes up { from { opacity: .4; transform: translateY(40px); } }
  .mov.nuevo { animation: imprime 1.2s ease-out; } @keyframes imprime { from { background: var(--note-soft); } }
}

<body>
<div class="demo" id="demoBanner" hidden>Versión de prueba con los gastos de 2026. Lo que apuntes aquí no se guarda en Google.</div>
<header class="band">
  <svg class="guil" id="guil" aria-hidden="true" preserveAspectRatio="none"></svg>
  <div class="band-in">
    <div class="band-top">
      <div class="marca"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h26" stroke="currentColor" stroke-width="2"/><circle cx="22" cy="19" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>Gastos Casa</div>
      <button type="button" class="sync" id="syncPill"><i></i><span>Conectando…</span></button>
    </div>

  <button type="button" data-tab="libreta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2Z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>El mes</button>
  <button type="button" data-tab="anio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V10M9 20V5M14 20v-8M19 20V8"/></svg>El año</button>
  <button type="button" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ajustes</button>
</nav>

<script>
'use strict';
/* ====================== conceptos (mismas columnas que el Excel) ====================== */
const ICO = {
  agua: '<path d="M16 4c4 6 7 9.5 7 13.5A7 7 0 0 1 9 17.5C9 13.5 12 10 16 4Z"/><path d="M12.5 19a3.5 3.5 0 0 0 3.5 3"/><path d="M8 27h16"/>',
  monte: '<path d="M3 26 12 10l5 8 3-4 9 12Z"/><path d="m12 10 3 5-3-1-2 2"/>',
  llave: '<circle cx="11" cy="16" r="5"/><path d="M16 16h12M24 16v4M28 16v3"/>',
  portal: '<path d="M6 28V6h20v22"/><path d="M3 28h26"/><path d="M11 11h3M18 11h3M11 16h3M18 16h3"/><path d="M14 28v-6h4v6"/>',
  rayo: '<path d="M18 3 7 18h8l-2 11 12-16h-8Z"/>',
  ola: '<path d="M3 20c3 0 3-2 6.5-2S13 20 16 20s3-2 6.5-2 3.5 2 6.5 2"/><path d="M3 26c3 0 3-2 6.5-2S13 26 16 26s3-2 6.5-2 3.5 2 6.5 2"/><path d="M10 15V6a2 2 0 0 1 4 0M18 15V6a2 2 0 0 1 4 0M10 9h8M10 13h8"/>',
  casa: '<path d="M4 15 16 5l12 10"/><path d="M7 13v14h18V13"/><path d="M16 16.5c2 .8 3.5 1 3.5 1 0 4-1.5 6-3.5 7-2-1-3.5-3-3.5-7 0 0 1.5-.2 3.5-1Z"/>',
  coche: '<path d="M5 21v-4l3-7h16l3 7v4Z"/><path d="M5 21v4h4v-4M23 21v4h4v-4"/><circle cx="10" cy="17" r="1.3"/><circle cx="22" cy="17" r="1.3"/>',
  banco: '<path d="M4 12 16 5l12 7Z"/><path d="M7 14v9M12.5 14v9M19.5 14v9M25 14v9"/><path d="M4 26h24"/>',
  movil: '<rect x="9" y="3" width="14" height="26" rx="3"/><path d="M14 25h4"/>',
  carro: '<path d="M3 6h4l3 14h15l3-10H9"/><circle cx="12" cy="25" r="2"/><circle cx="23" cy="25" r="2"/>',
  ticket: '<path d="M8 3h16v26l-3-2-2.7 2-2.3-2-2.3 2-2.7-2-3 2Z"/><path d="M12 9h8M12 13h8M12 17h5"/>'
};
const CATS = [
  { k: 'AGUA Y RESIDUOS', n: 'Agua y residuos', i: 'agua' },
  { k: 'ARSENAL', n: 'Arsenal', i: 'monte' },
  { k: 'BAJERA', n: 'Bajera', i: 'llave' },
  { k: 'COMUNIDAD', n: 'Comunidad', i: 'portal' },
  { k: 'IBERDROLA', n: 'Iberdrola', i: 'rayo' },
  { k: 'PISCINA', n: 'Piscina', i: 'ola' },
  { k: 'SEGUROS CASA', n: 'Seguro de casa', i: 'casa' },
  { k: 'SEGUROS COCHE', n: 'Seguro del coche', i: 'coche' },
  { k: 'VARIOS INTERESES', n: 'Varios intereses', i: 'banco' },
  { k: 'VODAFONE', n: 'Vodafone', i: 'movil' },
  { k: 'COMPRA', n: 'Compra', i: 'carro' },
  { k: 'OTROS GASTOS', n: 'Otros gastos', i: 'ticket' }
];
const CAT = Object.fromEntries(CATS.map(c => [c.k, c]));
const icono = k => `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[(CAT[k] || CATS[11]).i]}</svg>`;
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ====================== estado ====================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem('gastoscasa.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gastoscasa.' + k, JSON.stringify(v)); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const mesDe = iso => String(iso).slice(0, 7);
const mesHoy = () => hoyISO().slice(0, 7);
const mover = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const nombreMes = ym => { const [y, m] = ym.split('-').map(Number); return MESES_L[m - 1][0].toUpperCase() + MESES_L[m - 1].slice(1) + ' ' + y; };
const eur = (n, dec = 2) => Number(n || 0).toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: true });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const S = { vista: 'anio', cmpCat: '', cmpA: '', cmpB: '', cmpMes: null, busca: '', error: store.get('error', null), gastos: [], pend: [], cfg: store.get('cfg', null), demo: false, tab: 'apuntar', mes: mesHoy(), online: true, ultimaSync: null, nuevo: null };
S.xlDesde = 1; S.xlHasta = 12;
const periodoTxt = (d, h) => d === 1 && h === 12 ? '' : d === h ? MESES_L[d - 1] : MESES_L[d - 1] + '-' + MESES_L[h - 1];
const nombreXl = (y, d, h) => `Descargar Excel · ${periodoTxt(d, h) ? periodoTxt(d, h).replace('-', ' a ') : 'año entero'} ${y}`;
const deFila = r => ({ id: String(r[0]), fecha: String(r[1]).slice(0, 10), categoria: String(r[2]).toUpperCase(), importe: Math.round(Number(r[3]) * 100) / 100, nota: String(r[4] || '') });

/* importes escritos de cualquier manera: "12,5", "12.50 €", "1.234,56", "12'5", "-3" */
function leerImporte(txt) {
  let t = String(txt || '').trim().replace(/[€\s]|eur(os)?/gi, '').replace(/'/g, ',');
  if (!t) return null;
  const neg = /^-/.test(t); t = t.replace(/^[-+]/, '');
  if (!/^[\d.,]+$/.test(t)) return NaN;
  const ultimo = Math.max(t.lastIndexOf(','), t.lastIndexOf('.'));
  let ent, dec = '';
  if (ultimo >= 0 && t.length - ultimo - 1 <= 2 && t.length - ultimo - 1 > 0) { ent = t.slice(0, ultimo); dec = t.slice(ultimo + 1); }
  else if (ultimo === t.length - 1) { ent = t.slice(0, -1); }
  else ent = t;
  ent = ent.replace(/[.,]/g, '');
  const v = Number((ent || '0') + (dec ? '.' + dec : ''));
  return isFinite(v) ? Math.round((neg ? -v : v) * 100) / 100 : NaN;
}

/* ====================== conexión con Google (igual que Mendiak) ====================== */
function partirDireccion(txt, claveAparte) {
  let t = String(txt || '').trim();
  let k = String(claveAparte || '').trim();
  const mk = t.match(/[?&#]k=([^&#\s]+)/);
  if (mk) k = decodeURIComponent(mk[1]);
  const mu = t.match(/[#?&]u=([^&#\s]+)/);
  if (mu) t = decodeURIComponent(mu[1]);
  const me = t.match(/https:\/\/script\.google(?:usercontent)?\.com\/[^?#\s]*\/exec/);
  return { url: me ? me[0] : t.replace(/[?#].*$/, ''), k: k };
}
function leerConfigDeEnlace() {
  const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  const u = h.get('u') || q.get('u'), k = h.get('k') || q.get('k');
  if (u && k) {
    S.cfg = partirDireccion(u, k); store.set('cfg', S.cfg);
    if (location.hash) history.replaceState(null, '', location.pathname + '?u=' + encodeURIComponent(S.cfg.url) + '&k=' + encodeURIComponent(S.cfg.k));
  } else if (S.cfg && S.cfg.url && S.cfg.k && !q.get('u')) {
    history.replaceState(null, '', location.pathname + '?u=' + encodeURIComponent(S.cfg.url) + '&k=' + encodeURIComponent(S.cfg.k));
  }
}
async function api(method, body) {
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(S.cfg.url)) throw new Error('DIRECCION');
  if (!S.cfg.k) throw new Error('CLAVE');
  const u = S.cfg.url + (method === 'GET' ? (S.cfg.url.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(S.cfg.k) : '');
  const r = await fetch(u, method === 'GET' ? { cache: 'no-store' } : { method: 'POST', body: JSON.stringify(Object.assign({ k: S.cfg.k }, body)) });
  const txt = await r.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('NOJSON'); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j;
}
/* fallos que se arreglan solos al reintentar (sin internet, Google ocupado…): lo pendiente se queda en la cola */
const esPasajero = e => /CLAVE|DIRECCION|NOJSON|OCUPADO|fetch|network|Load failed|timeout|tiempo de espera|lock|Servic/i.test(String(e && e.message || e));
let sincronizando = false, repetir = false;
async function enviarPendientes() {
  while (S.pend.length) {
    const lote = S.pend.slice();
    let hechos;
    try { hechos = (await api('POST', { ops: lote })).hechos || []; }
    catch (e) {
      if (esPasajero(e)) throw e;
      // un script antiguo rechaza el lote entero: se manda de uno en uno para saber cuál falla
      hechos = [];
      for (const op of lote) {
        try { hechos.push(((await api('POST', { ops: [op] })).hechos || [])[0] || { ok: true }); }
        catch (e2) { if (esPasajero(e2)) throw e2; hechos.push({ ok: false, error: String(e2.message || e2) }); }
      }
    }
    // sale de la cola solo lo enviado en este lote: lo apuntado mientras tanto se queda para la siguiente vuelta
    S.pend = S.pend.filter(op => !lote.includes(op)); store.set('pend', S.pend);
    const malos = hechos.filter(h => h && h.ok === false);
    if (malos.length) avisarRechazo(malos);
  }
}
function avisarRechazo(malos) {
  const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const txt = (malos.length === 1 ? 'Google no ha aceptado un cambio' : `Google no ha aceptado ${malos.length} cambios`) + ': ' + malos.map(h => h.error).join(' · ');
  S.error = [hora, txt]; store.set('error', S.error); S.rechazo = true;
  toast(txt);
}
async function sincronizar(mostrar) {
  if (S.demo || !S.cfg) { pintarEstado(); return; }
  if (sincronizando) { repetir = true; return; }
  sincronizando = true; repetir = false; S.rechazo = false; pintarEstado('sync');
  try {
    await enviarPendientes();
    const j = await api('GET');
    S.gastos = j.gastos.map(deFila);
    S.pend.forEach(aplicarLocal);   // lo apuntado mientras se descargaban los datos
    store.set('cache', { gastos: j.gastos, hora: j.hora });
    S.ultimaSync = new Date(); S.online = true;
    if (!S.rechazo) { S.error = null; store.set('error', null); }   // el aviso de un rechazo se queda en Ajustes
    if (mostrar) toast('Datos al día');
    render();
  } catch (e) {
    S.online = false;
    S.error = explicarError(e); store.set('error', S.error);
    if (S.tab === 'ajustes') vAjustes();
    if (String(e.message).includes('CLAVE')) toast('La clave de conexión no es correcta. Revísala en Ajustes.');
    else if (mostrar) toast('Sin conexión. Lo apuntado se enviará después.');
  }
  sincronizando = false; pintarEstado();
  if (repetir && S.online && S.pend.length) sincronizar();
}
function explicarError(e) {
  const m = String(e && e.message || e);
  const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  if (m === 'DIRECCION') return [hora, 'La dirección del script no es la buena: tiene que empezar por https://script.google.com/macros/s/ y terminar en /exec (sin ?k= ni nada detrás).'];
  if (m === 'NOJSON') return [hora, 'Google ha devuelto una página en vez de los datos. Revisa en la implementación que «Quién tiene acceso» sea «Cualquier usuario».'];
  if (m.includes('CLAVE')) return [hora, 'La clave no coincide con la del script. Ejecuta de nuevo «configurar» en Apps Script y copia la clave que salga.'];
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return [hora, navigator.onLine
    ? 'Google no deja leer los datos desde la app. Casi siempre es porque en la implementación «Quién tiene acceso» está en «Cualquier usuario con una cuenta de Google»: cámbialo a «Cualquier usuario» (Gestionar implementaciones → lápiz → Versión: nueva versión → Implementar).'
    : 'Este aparato no tiene internet ahora mismo.'];
  if (/null|undefined|getRange|getLastRow/.test(m)) return [hora, 'El script no encuentra la pestaña «Gastos» en la hoja. Comprueba que se llame exactamente así. (' + m + ')'];
  return [hora, m];
}
function aplicarLocal(op) {
  if (op.accion === 'crear') S.gastos.push(Object.assign({ _local: true }, op.gasto));
  if (op.accion === 'editar') S.gastos = S.gastos.map(x => x.id === op.gasto.id ? Object.assign({ _local: true }, op.gasto) : x);
  if (op.accion === 'borrar') S.gastos = S.gastos.filter(x => x.id !== op.id);
}
function encolar(op) {
  aplicarLocal(op);
  if (S.demo) return;
  S.pend.push(op); store.set('pend', S.pend);
  sincronizar();
}
function pintarEstado(modo) {
  const p = $('#syncPill'); if (!p) return;
  p.classList.toggle('busy', modo === 'sync');
  p.classList.toggle('off', !S.demo && (!S.cfg || !S.online || S.pend.length > 0));
  p.querySelector('span').textContent = S.demo ? 'Prueba' : !S.cfg ? 'Sin conectar' : modo === 'sync' ? 'Guardando…'
    : S.pend.length ? `${S.pend.length} por enviar` : S.online ? 'Guardado' : 'Sin conexión';
}

/* ====================== cálculos ====================== */
const delMes = ym => S.gastos.filter(g => mesDe(g.fecha) === ym);
const suma = arr => Math.round(arr.reduce((a, g) => a + g.importe, 0) * 100) / 100;
function mediaAnual(y) {
  // media de los meses del año con algún gasto (como la hoja RESUMEN)
  const t = {}; S.gastos.filter(g => g.fecha.startsWith(y + '-')).forEach(g => { const m = mesDe(g.fecha); t[m] = (t[m] || 0) + g.importe; });
  const v = Object.values(t).filter(x => x > 0);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
}
/* habituales: concepto + nota que aparecen en al menos 2 de los 3 meses anteriores y aún no en este */
function faltan(ym) {
  const clave = g => g.categoria + '|' + g.nota.trim().toLowerCase();
  const prev = [1, 2, 3].map(n => delMes(mover(ym, -n)));
  const cuenta = new Map();
  prev.forEach((arr, idx) => {
    const vistos = new Map();
    arr.forEach(g => vistos.set(clave(g), (vistos.get(clave(g)) || 0) + 1));
    vistos.forEach((n, k) => {
      const c = cuenta.get(k) || { meses: 0, n: 0, ult: null };
      c.meses++; c.n = Math.max(c.n, n);
      if (!c.ult) c.ult = arr.filter(g => clave(g) === k).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
      cuenta.set(k, c);
    });
  });
  const ahora = new Map(); delMes(ym).forEach(g => ahora.set(clave(g), (ahora.get(clave(g)) || 0) + 1));
  const out = [];
  cuenta.forEach((c, k) => { if (c.meses >= 2 && (ahora.get(k) || 0) < 1) out.push(c.ult); });
  return out.sort((a, b) => CATS.findIndex(c => c.k === a.categoria) - CATS.findIndex(c => c.k === b.categoria));
}

/* ====================== interfaz ====================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let toastT;
function toast(msg) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200);
}
function guilloche() {
  // líneas onduladas de billete, dibujadas una vez
  const svg = $('#guil'); const W = 1200, H = 260; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let d = '';
  for (let j = 0; j < 22; j++) {
    const fase = j * .42, amp = 18 + 10 * Math.sin(j * .7), base = 20 + j * 11;
    let p = '';
    for (let x = 0; x <= W; x += 8) {
      const y = base + amp * Math.sin(x / 70 + fase) * Math.cos(x / 230 - fase / 2);
      p += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);
    }
    d += `<path d="${p}"/>`;
  }
  svg.innerHTML = `<g fill="none" stroke="var(--guil)" stroke-width="1">${d}</g>`;
}
function cabecera() {
  const ym = S.mes, y = ym.slice(0, 4);
  $('#mesTxt').textContent = nombreMes(ym);
  $('#mNext').disabled = ym >= mesHoy();
  const t = suma(delMes(ym));
  const [e, c] = eur(t).split(',');
  $('#totalTxt').innerHTML = `${e}<small>,${c} €</small>`;
  const media = mediaAnual(y);
  const dif = t - media;
  $('#vsTxt').innerHTML = !t ? 'Sin gastos apuntados este mes'
    : media && Math.abs(dif) >= 0.5 ? `<span class="${dif > 0 ? 'up' : 'down'}">${dif > 0 ? '▲' : '▼'} <b class="num">${eur(Math.abs(dif))} €</b></span> ${dif > 0 ? 'por encima' : 'por debajo'} de la media de ${y}`
    : `En la media de ${y}`;
}
function render() {
  cabecera();
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  ({ apuntar: vApuntar, libreta: vLibreta, anio: vAnio, ajustes: vAjustes })[S.tab]();
  pintarEstado();
}
function irA(tab) { S.tab = tab; cerrarHoja(); render(); window.scrollTo(0, 0); }

/* ---- libreta del mes (movimientos impresos) ---- */
const fechaCorta = (g, conAnio) => (/^X/.test(g.id) ? MESES_C[+g.fecha.slice(5, 7) - 1] : g.fecha.slice(8, 10) + ' ' + MESES_C[+g.fecha.slice(5, 7) - 1]) + (conAnio ? ' ' + g.fecha.slice(2, 4) : '');
const filaMov = (g, conAnio) => `<button type="button" class="mov ${g._local && S.pend.length ? 'pend' : ''} ${g.id === S.nuevo ? 'nuevo' : ''}" data-id="${esc(g.id)}">

/* ---- El mes ---- */
function vLibreta() {

/* ---- El año ---- */

const listaAnios = () => [...new Set(S.gastos.map(g => g.fecha.slice(0, 4)).concat([mesHoy().slice(0, 4)]))].sort();

}
function vAnio() {

  $$('[data-per]').forEach(b => { const [d, h] = b.dataset.per.split('-').map(Number); b.classList.toggle('on', d === S.xlDesde && h === S.xlHasta); b.onclick = () => fijar(d, h); });
  $('#xlBtn').onclick = () => exportarExcel(y, S.xlDesde, S.xlHasta);

/* ---- todos los años: totales, evolución y comparación ---- */
function vTodos() {
  const anios = listaAnios().filter(a => S.gastos.some(g => g.fecha.startsWith(a + '-')));
  const hoyY = mesHoy().slice(0, 4), hoyM = +mesHoy().slice(5);
  const cat = S.cmpCat && CAT[S.cmpCat] ? S.cmpCat : '';
  const base = cat ? S.gastos.filter(g => g.categoria === cat) : S.gastos;
  const nomCat = cat ? CAT[cat].n : 'todos los gastos';
  const deAnio = (a, hasta = 12) => base.filter(g => g.fecha.startsWith(a + '-') && +g.fecha.slice(5, 7) <= hasta);
  const porMes = a => Array.from({ length: 12 }, (_, i) => suma(base.filter(g => g.fecha.startsWith(`${a}-${pad(i + 1)}`))));
  const totA = a => suma(deAnio(a));
  // años a comparar
  if (!anios.includes(S.cmpA)) S.cmpA = anios[anios.length - 1];
  if (!anios.includes(S.cmpB) || S.cmpB === S.cmpA) S.cmpB = anios.filter(a => a !== S.cmpA).slice(-1)[0] || '';
  const A = S.cmpA, B = S.cmpB;
  const total = suma(base);
  const mesesCon = new Set(base.map(g => mesDe(g.fecha))).size;
  const completos = anios.filter(a => a !== hoyY);
  const mediaAnio = completos.length ? completos.reduce((x, a) => x + totA(a), 0) / completos.length : 0;
  // año en curso: comparar con los mismos meses del año anterior
  const prevY = String(+hoyY - 1);
  const hayCurso = anios.includes(hoyY) && anios.includes(prevY);
  const curso = hayCurso ? [suma(deAnio(hoyY, hoyM)), suma(deAnio(prevY, hoyM))] : null;
  const pct = (a, b) => b ? Math.round((a - b) / b * 100) : null;
  const flecha = (a, b) => { const p = pct(a, b); return p === null ? '' : `<span class="dif ${p > 0 ? 'up' : p < 0 ? 'down' : ''}">${p > 0 ? '▲' : p < 0 ? '▼' : '='} ${Math.abs(p)} %</span>`; };
  const ymax = Math.max(...anios.map(totA), 1);
  // tabla conceptos x años
  const catsCon = CATS.filter(c => S.gastos.some(g => g.categoria === c.k));
  const celda = (k, a) => suma(S.gastos.filter(g => g.categoria === k && g.fecha.startsWith(a + '-')));
  $('#app').innerHTML = `<div class="view">
    <div class="panel-head cab-anio"><h2 style="margin:0">Todos los años</h2>${segAnios('todos')}</div>
    ${htmlBuscador('todos')}
    ${anios.length < 2 ? `<p class="aviso-anios">Por ahora solo hay gastos de ${anios[0] || hoyY}. En cuanto metas otro año, aquí podrás compararlos mes a mes y concepto a concepto.</p>` : ''}
    <section class="filtro-cat"><span class="lab">Ver</span>
      <div class="seg" role="group" aria-label="Concepto">
        <button type="button" data-cc2="" class="${cat ? '' : 'on'}">Todos los gastos</button>
        ${catsCon.map(c => `<button type="button" data-cc2="${c.k}" class="${cat === c.k ? 'on' : ''}">${c.n}</button>`).join('')}
      </div></section>
    <div class="cifras">
      <div class="cifra"><b class="num">${eur(total)} €</b><span>Total ${anios[0] || ''}${anios.length > 1 ? '–' + anios[anios.length - 1] : ''}</span></div>
      <div class="cifra"><b class="num">${completos.length ? eur(mediaAnio) + ' €' : '—'}</b><span>Media por año${completos.length ? ` (${completos.length} ${completos.length === 1 ? 'año completo' : 'años completos'})` : ''}</span></div>
      <div class="cifra"><b class="num">${mesesCon ? eur(total / mesesCon) + ' €' : '—'}</b><span>Media al mes (${mesesCon} meses)</span></div>
      <div class="cifra"><b class="num">${curso ? eur(curso[0]) + ' €' : '—'}</b><span>${curso ? `${hoyY} hasta ${MESES_L[hoyM - 1]} ${flecha(curso[0], curso[1])}<br>${eur(curso[1])} € en ${prevY}` : 'Año en curso'}</span></div>
    </div>

    <section class="panel"><div class="panel-head"><h3>Año a año</h3><span class="small muted">${esc(nomCat)}</span></div>
      <div class="anios">${anios.map((a, i) => { const v = totA(a); const ant = i ? totA(anios[i - 1]) : 0; const parcial = a === hoyY && hoyM < 12;
        return `<button type="button" class="arow" data-ver="${a}" aria-label="${a}: ${eur(v)} euros. Ver ese año">
          <span class="ay">${a}</span><span class="abar"><i style="width:${(v / ymax * 100).toFixed(1)}%" class="${parcial ? 'parcial' : ''}"></i></span>
          <span class="av num">${eur(v)} €${parcial ? `<small>hasta ${MESES_C[hoyM - 1]}</small>` : i ? `<small>${flecha(v, ant)}</small>` : '<small>&nbsp;</small>'}</span></button>`; }).join('')}</div>
      <p class="small muted" style="margin:0">${hayCurso ? `El año en curso aún no está completo: la flecha de arriba lo compara con los mismos meses de ${prevY}.` : ''} Toca un año para verlo.</p>
    </section>

    ${anios.length > 1 ? `<section class="panel"><div class="panel-head"><h3>Mes a mes</h3><span class="small muted">${esc(nomCat)}</span></div>
      <div class="cmp-sel">
        <label><span><i class="sw a"></i>Año</span><select id="cA">${anios.map(a => `<option ${a === A ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
        <label><span><i class="sw b"></i>Comparar con</span><select id="cB">${anios.filter(a => a !== A).map(a => `<option ${a === B ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
      </div>
      <div id="graf" class="graf"></div>
      <div id="lectura" class="lectura" aria-live="polite"></div>
      <details><summary>Ver como tabla</summary><div class="tabla-wrap" id="tablaMeses"></div></details>
    </section>` : ''}

    <section class="panel"><div class="panel-head"><h3>Cada concepto por años</h3></div>
      <p class="small muted" style="margin:0">Toca un concepto para ver su evolución arriba.</p>
      <div class="tabla-wrap"><table class="tabla">
        <thead><tr><th scope="col">Concepto</th>${anios.map(a => `<th scope="col" class="num">${a}${a === hoyY && hoyM < 12 ? '*' : ''}</th>`).join('')}${anios.length > 1 ? '<th scope="col">Cambio</th>' : ''}</tr></thead>
        <tbody>${catsCon.map(c => { const vs = anios.map(a => celda(c.k, a));
          const ult = anios[anios.length - 1], pen = anios[anios.length - 2];
          const hasta = ult === hoyY ? hoyM : 12;
          const cmp = pen ? [suma(S.gastos.filter(g => g.categoria === c.k && g.fecha.startsWith(ult + '-') && +g.fecha.slice(5, 7) <= hasta)), suma(S.gastos.filter(g => g.categoria === c.k && g.fecha.startsWith(pen + '-') && +g.fecha.slice(5, 7) <= hasta))] : null;
          return `<tr class="${cat === c.k ? 'sel' : ''}" data-cc2="${c.k}" tabindex="0"><th scope="row">${c.n}</th>${vs.map(v => `<td class="num">${v ? eur(v, 0) : '—'}</td>`).join('')}${cmp ? `<td>${flecha(cmp[0], cmp[1]) || '—'}</td>` : ''}</tr>`; }).join('')}
          <tr class="tot"><th scope="row">Total</th>${anios.map(a => `<td class="num">${eur(suma(S.gastos.filter(g => g.fecha.startsWith(a + '-'))), 0)}</td>`).join('')}${anios.length > 1 ? '<td></td>' : ''}</tr></tbody>
      </table></div>
      ${anios.includes(hoyY) && hoyM < 12 && anios.length > 1 ? `<p class="small muted" style="margin:0">* ${hoyY} hasta ${MESES_L[hoyM - 1]}. «Cambio» compara ${anios[anios.length - 1]} con ${anios[anios.length - 2]} en los mismos meses. Euros sin decimales.</p>` : '<p class="small muted" style="margin:0">Euros sin decimales.</p>'}
    </section>
  </div>`;
  enlazarAnios(); enlazarBuscador('todos');
  $$('[data-cc2]').forEach(b => { const ir = () => { S.cmpCat = b.dataset.cc2; vTodos(); }; b.onclick = ir; b.onkeydown = e => { if (e.key === 'Enter') ir(); }; });
  $$('[data-ver]').forEach(b => b.onclick = () => { S.vista = 'anio'; const a = b.dataset.ver; S.mes = a === hoyY ? mesHoy() : a + '-12'; render(); window.scrollTo(0, 0); });
  if (anios.length > 1) {
    $('#cA').onchange = e => { S.cmpA = e.target.value; vTodos(); };
    $('#cB').onchange = e => { S.cmpB = e.target.value; vTodos(); };
    grafMeses(anios, porMes, A, B, hoyY, hoyM);
  }
}
let grafRes;
window.addEventListener('resize', () => { clearTimeout(grafRes); grafRes = setTimeout(() => { if (S.tab === 'anio' && S.vista === 'todos' && $('#graf')) vTodos(); }, 250); });
function grafMeses(anios, porMes, A, B, hoyY, hoyM) {
  // dibujado a tamaño real del hueco, para que los textos no encojan en el móvil
  const W = Math.max(300, Math.round($('#graf').clientWidth || 640)), H = W < 500 ? 220 : 260, L = 44, R = 42, T = 14, Bm = 26;
  // meses sin ningún apunte = sin datos (no se dibujan como 0)
  const datos = Object.fromEntries(anios.map(a => [a, porMes(a).map((v, i) => (a === hoyY && i + 1 > hoyM) || !v ? null : v)]));
  const max = Math.max(1, ...anios.flatMap(a => datos[a].filter(v => v !== null)));

/* ---- buscador ---- */
const normal = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function buscar(y, texto) {
  const pal = normal(texto).split(/\s+/).filter(Boolean);
  if (!pal.length) return null;
  return S.gastos.filter(g => y === 'todos' || g.fecha.startsWith(y + '-')).filter(g => {
    const cat = CAT[g.categoria] || {};
    const hay = normal([cat.n, g.categoria, g.nota, eur(g.importe), String(g.importe), MESES_L[+g.fecha.slice(5, 7) - 1]].join(' '));
    return pal.every(p => hay.includes(p.replace('.', ',')) || hay.includes(p));
  }).sort((a, b) => a.fecha.localeCompare(b.fecha));
}
function pintarBusqueda(y) {

    ${r.map(g => filaMov(g, y === 'todos')).join('')}
    <div class="lib-foot"><span>Total</span><span class="num">${eur(tot)} €</span></div>
    ${y === 'todos' && new Set(r.map(g => g.fecha.slice(0, 4))).size > 1 ? `<div class="lib-hint" style="border:0">${[...new Set(r.map(g => g.fecha.slice(0, 4)))].sort().map(a => `${a}: <b class="num">${eur(suma(r.filter(g => g.fecha.startsWith(a))))} €</b>`).join(' · ')}</div>` : ''}

/* ---- hoja para apuntar / corregir ---- */

/* ====================== Excel: la misma plantilla de siempre ====================== */
function cargarScript(src) { return new Promise((ok, ko) => { if (window.JSZip) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
const COLS = 'CDEFGHIJKLMN'.split('');
const xmlEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
const colNum = c => { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
function ponerCelda(fila, col, n, valor) {
  const ref = col + n;
  const re = new RegExp('<c r="' + ref + '"[^>]*?(?:\\/>|>[\\s\\S]*?<\\/c>)');
  const prev = fila.match(re);
  const sm = prev && prev[0].match(/ s="(\d+)"/);
  const s = sm ? ' s="' + sm[1] + '"' : '';
  let celda;
  if (valor === '' || valor == null) celda = '<c r="' + ref + '"' + s + '/>';
  else if (typeof valor === 'number') celda = '<c r="' + ref + '"' + s + '><v>' + valor + '</v></c>';
  else celda = '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(valor) + '</t></is></c>';
  if (prev) return fila.replace(re, celda);
  const k = colNum(col); const cells = /<c r="([A-Z]+)\d+"/g; let m;
  while ((m = cells.exec(fila))) { if (colNum(m[1]) > k) return fila.slice(0, m.index) + celda + fila.slice(m.index); }
  return fila.replace(/<\/row>$/, celda + '</row>');
}
function rellenarMes(xml, gastos) {
  // un apunte por fila desde la 6: fecha y nota en B, el importe en la columna de su concepto
  const filas = gastos.map(g => { const v = {}; const sinDia = /^X/.test(g.id); // apuntes traídos del Excel antiguo: no tenían día
    v.B = sinDia ? g.nota : `${g.fecha.slice(8, 10)}/${g.fecha.slice(5, 7)}${g.nota ? '  ' + g.nota : ''}`; v[COLS[CATS.findIndex(c => c.k === g.categoria)]] = g.importe; return v; });
  const hechas = new Set();
  xml = xml.replace(/<row r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g, (fila, nn) => {
    const n = +nn; if (n < 6 || n > 488) return fila;
    if (/\/>$/.test(fila) && !/<\/row>$/.test(fila)) fila = fila.replace(/\/>$/, '></row>');
    const v = filas[n - 6]; if (!v) return fila;
    hechas.add(n);
    ['B'].concat(COLS).forEach(c => { if (v[c] !== undefined) fila = ponerCelda(fila, c, n, v[c]); });
    return fila;
  });
  // filas que no existen en la plantilla (más de 95 apuntes en un mes)
  const extra = filas.map((v, i) => [i + 6, v]).filter(([n]) => !hechas.has(n) && n <= 488)
    .map(([n, v]) => '<row r="' + n + '">' + ['B'].concat(COLS).filter(c => v[c] !== undefined).map(c => ponerCelda('<row></row>', c, n, v[c]).replace(/^<row>|<\/row>$/g, '')).join('') + '</row>');
  if (extra.length) {
    extra.forEach(r => {
      const n = +r.match(/r="(\d+)"/)[1];
      const re = /<row r="(\d+)"/g; let m, pos = -1;
      while ((m = re.exec(xml))) { if (+m[1] > n) { pos = m.index; break; } }
      xml = pos >= 0 ? xml.slice(0, pos) + r + xml.slice(pos) : xml.replace('</sheetData>', r + '</sheetData>');
    });
  }
  return xml;
}
async function exportarExcel(y, desde = 1, hasta = 12) {
  const b = $('#xlBtn'); const txt = b.textContent; b.disabled = true; b.textContent = 'Preparando el Excel…';
  try {
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const r = await fetch('plantilla.xlsx', { cache: 'no-cache' });
    if (!r.ok) throw new Error('plantilla');
    const zip = await JSZip.loadAsync(await r.arrayBuffer());
    for (let m = 1; m <= 12; m++) {
      const p = `xl/worksheets/sheet${m + 1}.xml`;
      const gs = m < desde || m > hasta ? [] : delMes(`${y}-${pad(m)}`).sort((a, b) => a.fecha.localeCompare(b.fecha));
      zip.file(p, rellenarMes(await zip.file(p).async('string'), gs));
    }
    // el año en los títulos ("ENERO 2026", "RESUMEN DE GASTOS ANUALES 2026"…)
    const ss = await zip.file('xl/sharedStrings.xml').async('string');
    const per = periodoTxt(desde, hasta).toUpperCase().replace('-', ' A ');
    let ss2 = ss.replace(/(<t[^>]*>[^<]*?)2026([^<]*<\/t>)/g, `$1${y}$2`);
    if (per) ss2 = ss2.replace(`RESUMEN DE GASTOS ANUALES ${y}`, `RESUMEN DE GASTOS ${y} (${per})`).replace(`TOTAL GASTADO EN ${y}`, `TOTAL GASTADO ${per} ${y}`);
    zip.file('xl/sharedStrings.xml', ss2);
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `GASTOS_CASA_${y}${periodoTxt(desde, hasta) ? '_' + periodoTxt(desde, hasta) : ''}.xlsx`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast(`Excel descargado: ${periodoTxt(desde, hasta) || 'año'} ${y}`);
  } catch (e) {
    toast(String(e.message) === 'plantilla' ? 'No encuentro la plantilla del Excel.' : 'Hace falta conexión para preparar el Excel.');
  }
  b.disabled = false; b.textContent = txt;
}

    <h2>Ajustes</h2>
    <section class="panel"><h3>Conexión con Google</h3>
      ${S.error ? `<p style="margin:0;padding:10px 12px;border-radius:10px;background:var(--stamp-soft);color:var(--ink)"><b style="color:var(--stamp)">No se ha podido conectar (${esc(S.error[0])})</b><br>${esc(S.error[1])}</p>` : (S.ultimaSync ? '<p style="margin:0"><span class="sello">Conectado</span></p>' : '')}
      <p class="small muted" style="margin:0">Se configura sola al abrir el enlace de instalación. Solo hace falta tocar esto si cambia.</p>
      <div class="field"><label for="aUrl">Dirección del script <span class="muted small">(puedes pegar la que acaba en /exec?k=… y la clave se rellena sola)</span></label><input type="url" id="aUrl" value="${esc(S.cfg?.url || '')}" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="field"><label for="aK">Clave</label><input type="text" id="aK" value="${esc(S.cfg?.k || '')}" autocomplete="off"></div>
      <div class="seg"><button type="button" class="btn go" id="aSave">Guardar y actualizar</button><button type="button" class="btn" id="aSync">Actualizar ahora</button></div>
      <p class="small muted" style="margin:0">${S.ultimaSync ? 'Última actualización: ' + S.ultimaSync.toLocaleString('es-ES') : ''}${S.pend.length ? ' · ' + S.pend.length + ' cambios por enviar' : ''}</p>
    </section>
    <section class="panel"><h3>Tamaño de letra</h3>
      <div class="seg" role="group" aria-label="Tamaño de letra">${[['normal', 'Normal'], ['grande', 'Grande'], ['xgrande', 'Muy grande']].map(([k, t]) => `<button type="button" class="${store.get('letra', 'normal') === k ? 'on' : ''}" data-letra="${k}">${t}</button>`).join('')}</div>
      <p class="small muted" style="margin:0">Se guarda en este aparato.</p>
    </section>
  </div>`;
  $$('[data-letra]').forEach(b => b.onclick = () => { store.set('letra', b.dataset.letra); aplicarLetra(); vAjustes(); });
  $('#aSave').onclick = () => {
    S.cfg = partirDireccion($('#aUrl').value, $('#aK').value); store.set('cfg', S.cfg);
    // la barra de direcciones pasa a llevar la conexión nueva (antes podía quedarse una vieja y deshacer el cambio)
    history.replaceState(null, '', location.pathname + '?u=' + encodeURIComponent(S.cfg.url) + '&k=' + encodeURIComponent(S.cfg.k));
    S.error = null; store.set('error', null); S.online = true;
    sincronizar(true).then(() => { if (S.tab === 'ajustes') vAjustes(); });
  };
  $('#aSync').onclick = () => sincronizar(true);
}

/* ====================== arranque ====================== */
$$('nav.tabs button').forEach(b => b.onclick = () => irA(b.dataset.tab));
$('#mPrev').onclick = () => { S.mes = mover(S.mes, -1); render(); };
$('#mNext').onclick = () => { if (S.mes < mesHoy()) { S.mes = mover(S.mes, 1); render(); } };
$('#syncPill').onclick = () => S.demo ? toast('Versión de prueba: no se conecta a Google.') : (S.cfg && !S.error ? sincronizar(true) : irA('ajustes'));
window.addEventListener('online', () => sincronizar());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });
function aplicarLetra() { const l = store.get('letra', 'normal'); document.documentElement.classList.toggle('grande', l === 'grande'); document.documentElement.classList.toggle('xgrande', l === 'xgrande'); }
function arrancar() {
  aplicarLetra(); guilloche();
  if (window.GASTOS_DEMO) {
    S.demo = true; $('#demoBanner').hidden = false;
    S.gastos = window.GASTOS_DEMO.map(deFila);
  } else {
    leerConfigDeEnlace();
    S.pend = store.get('pend', []);
    const c = store.get('cache', null);
    if (c) S.gastos = c.gastos.map(deFila);
    S.pend.forEach(aplicarLocal);
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  render();
  if (!S.demo) { if (S.cfg) sincronizar(); else if (!S.gastos.length) irA('ajustes'); }
}
arrancar();
</script>
</body>
</html>
